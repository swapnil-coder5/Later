services:
  - type: web
    name: later-local-ai
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: OLLAMA_MODEL
        value: qwen2.5:0.5b
      - key: OLLAMA_CONTEXT
        value: 4096
      - key: OLLAMA_MODELS
        value: /var/lib/ollama/models
      - key: OLLAMA_MAX_LOADED_MODELS
        value: 1
      - key: OLLAMA_NUM_PARALLEL
        value: 1
    disk:
      name: ollama-models
      mountPath: /var/lib/ollama
      sizeGB: 5
